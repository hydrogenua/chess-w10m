<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Chess</title>
  <link rel="stylesheet" href="default.css" />
</head>
<body>
  <div id="screen-menu" class="screen">
    <div id="glyph">&#9822;</div>
    <h1>Chess</h1>
    <div class="row-label">Режим</div>
    <div class="seg" id="seg-mode">
      <button data-v="bot" class="on">С ботом</button>
      <button data-v="2p">Вдвоём</button>
    </div>
    <div id="bot-options">
      <div class="row-label">Уровень</div>
      <div class="seg" id="seg-level">
        <button data-v="1">Легко</button>
        <button data-v="2" class="on">Норм</button>
        <button data-v="3">Сложно</button>
      </div>
      <div class="row-label">Твой цвет</div>
      <div class="seg" id="seg-color">
        <button data-v="w" class="on">Белые</button>
        <button data-v="b">Чёрные</button>
      </div>
    </div>
    <button id="btn-start">Играть</button>
    <div id="menu-status"></div>
  </div>

  <div id="screen-game" class="screen hidden">
    <div id="topbar">
      <button id="btn-menu">Меню</button>
      <div id="status"></div>
    </div>
    <div id="board-wrap"><div id="board"></div></div>
    <div id="bottombar">
      <button id="btn-undo">&#8630; Отменить</button>
    </div>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/bot.js"></script>
  <script src="default.js"></script>
</body>
</html>
